    <script>
        // Tree rendering logic
        let allCategories = [];
        let expandedState = false;

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',');

            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                if (values.length > 0) {
                    allCategories.push({
                        term_id: values[0],
                        name: values[1],
                        parent: values[5] || '0'
                    });
                }
            }
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                if (line[i] === '"') {
                    inQuotes = !inQuotes;
                } else if (line[i] === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += line[i];
                }
            }
            result.push(current.trim());
            return result;
        }

        function buildTree(parentId, level = 0) {
            const children = allCategories.filter(cat => cat.parent === parentId);

            if (children.length === 0) return '';

            let html = '';
            children.forEach(cat => {
                const hasChildren = allCategories.some(c => c.parent === cat.term_id);
                const levelClass = level === 0 ? 'main' : `level-${level}`;

                html += `
                    <div class="category" data-id="${cat.term_id}" data-name="${cat.name.toLowerCase()}">
                        <div class="category-header ${levelClass}" >
                            <span  style="cursor: pointer;"><span onclick="toggleCategory('${cat.term_id}')" style="cursor: pointer;">${hasChildren ? '<span class="toggle-icon">▶</span>' : '<span class="toggle-icon">•</span>'}</span></span>
                            <span class="category-name"  style="cursor: pointer; flex: 1;">${cat.name}</span>
                            <span class="category-id" onclick="copyID('${cat.term_id}')" title="Click to copy ID">ID: ${cat.term_id}</span>
                        </div>
                        <div class="children" id="children-${cat.term_id}">
                            ${buildTree(cat.term_id, level + 1)}
                        </div>
                    </div>
                `;
            });

            return html;
        }

        function toggleCategory(id) {
            const childrenDiv = document.getElementById(`children-${id}`);
            const header = childrenDiv.previousElementSibling;
            const icon = header.querySelector('.toggle-icon');

            if (childrenDiv.classList.contains('show')) {
                childrenDiv.classList.remove('show');
                icon.classList.remove('expanded');
            } else {
                childrenDiv.classList.add('show');
                icon.classList.add('expanded');
            }
        }

        function expandAll() {
            const allChildren = document.querySelectorAll('.children');
            const allIcons = document.querySelectorAll('.toggle-icon');
            const btn = document.getElementById('expandAllBtn');

            if (!expandedState) {
                allChildren.forEach(child => child.classList.add('show'));
                allIcons.forEach(icon => icon.classList.add('expanded'));
                btn.textContent = 'Collapse All';
                expandedState = true;
            } else {
                allChildren.forEach(child => child.classList.remove('show'));
                allIcons.forEach(icon => icon.classList.remove('expanded'));
                btn.textContent = 'Expand All';
                expandedState = false;
            }
        }

        function searchCategories(query) {
            const categories = document.querySelectorAll('.category');
            let visibleCount = 0;

            categories.forEach(cat => {
                const name = cat.dataset.name;
                const id = cat.dataset.id;

                if (query === '' || name.includes(query.toLowerCase()) || id.includes(query)) {
                    cat.style.display = 'block';
                    visibleCount++;

                    // Highlight matching text
                    if (query !== '') {
                        const nameSpan = cat.querySelector('.category-name');
                        const text = nameSpan.textContent;
                        const regex = new RegExp(`(${query})`, 'gi');
                        nameSpan.innerHTML = text.replace(regex, '<mark>$1</mark>');
                    }
                } else {
                    cat.style.display = 'none';
                }
            });

            if (visibleCount === 0 && query !== '') {
                document.getElementById('treeContainer').innerHTML = '<div class="no-results">No categories found</div>';
            } else if (query === '') {
                // Reset highlights
                document.querySelectorAll('.category-name').forEach(span => {
                    span.textContent = span.textContent;
                });
            }
        }

        function calculateStats() {
            const total = allCategories.length;
            const main = allCategories.filter(cat => cat.parent === '0').length;

            // Calculate max depth
            function getDepth(catId, depth = 0) {
                const children = allCategories.filter(c => c.parent === catId);
                if (children.length === 0) return depth;
                return Math.max(...children.map(c => getDepth(c.term_id, depth + 1)));
            }

            const maxDepth = Math.max(...allCategories.filter(c => c.parent === '0').map(c => getDepth(c.term_id, 1)));

            document.getElementById('totalCategories').textContent = total;
            document.getElementById('mainCategories').textContent = main;
            document.getElementById('maxDepth').textContent = maxDepth;
        }

        // Event Listeners
        document.getElementById('expandAllBtn').addEventListener('click', expandAll);
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchCategories(e.target.value);
        });

        
        function copyID(id) {
            // Copy to clipboard
            navigator.clipboard.writeText(id).then(() => {

        }
